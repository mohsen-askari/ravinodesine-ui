name: frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests: signature vector, stale/invalid/duplicate webhooks, API mapper against recorded contract fixtures, footer, proxy gate.
      - run: npm test
      # Production build in the default (static) mode, then the whole Playwright suite against it.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # API mode against a mock API (builds into .next-api): webhook, refresh, outage, made-up addresses.
      - run: npm run test:e2e:api
      # Runtime dependencies only; fails the job on a high or critical advisory.
      - run: npm audit --omit=dev --audit-level=high
      # Always: with retries a test can pass on its second attempt; the trace of the first failed attempt is kept here.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
